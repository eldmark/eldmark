name: Update README (activity blocks)

on:
  push:
    branches: [main]
  schedule:
    # Runs daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    # Skip when the commit was made by the bot itself to avoid infinite loops.
    if: >
      github.actor != 'github-actions[bot]' &&
      !startsWith(github.event.head_commit.message, 'chore: update README')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute latest commit info
        id: commit
        run: |
          echo "sha=$(git rev-parse --short HEAD)"   >> "$GITHUB_OUTPUT"
          echo "subject=$(git log -1 --format='%s')" >> "$GITHUB_OUTPUT"

      - name: Update CURRENTLY_WORKING block
        run: |
          CONTENT="- Working on **eldmark/eldmark** (main) — \`${{ steps.commit.outputs.sha }}\` ${{ steps.commit.outputs.subject }}"
          bash scripts/update-readme-blocks.sh README.md CURRENTLY_WORKING "$CONTENT"

      # Latest public push events across all repositories, one line per commit.
      # Written to a file (not a step output) so commit messages cannot break
      # an output delimiter or be re-evaluated by the shell.
      - name: Build recent development list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/recent-activity.py "${{ github.repository_owner }}" 5 > recent.txt

      - name: Update LATEST_COMMIT block
        run: |
          set -euo pipefail
          if [ ! -s recent.txt ]; then
            echo "No public push events found; leaving block untouched."
          else
            bash scripts/update-readme-blocks.sh README.md LATEST_COMMIT "$(cat recent.txt)"
          fi
          rm -f recent.txt

      # The status panel is baked in here; the CRT carousel animates in the
      # visitor's browser, so no workflow has to run to keep it moving.
      - name: Regenerate hero panel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_hero.py "${{ github.repository_owner }}"

      - name: Commit changes if any
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/generated/hero.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update README (latest commit)"
            git push
          fi
